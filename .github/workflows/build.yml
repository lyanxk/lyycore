name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run gameplay regressions
        run: ./gradlew -I tools/review-regressions/init.gradle runReviewRegressions --console=plain --no-configuration-cache

      - name: Print gameplay logs on failure
        if: failure()
        run: |
          if [ -f build/review-regressions/run/logs/latest.log ]; then
            tail -n 500 build/review-regressions/run/logs/latest.log
          fi
