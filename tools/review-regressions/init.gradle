// Headless gameplay checks, excluded from normal mod builds.
// ./gradlew.bat -I tools/review-regressions/init.gradle runReviewRegressions --console=plain
allprojects {
    afterEvaluate {
        def structure = file('build/review-regressions/resources/data/lyycore/structure/empty.nbt')
        def fixture = tasks.register('prepareReviewRegressionStructure') {
            outputs.file(structure)
            doLast {
                structure.parentFile.mkdirs()
                new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(structure))).withCloseable { out ->
                    out.writeByte(10); out.writeUTF('')
                    out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                    out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                    out.writeInt(8); out.writeInt(5); out.writeInt(8)
                    out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                    out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                    ['blocks', 'entities'].each { name ->
                        out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
                    }
                    out.writeByte(0)
                }
            }
        }
        def checks = sourceSets.create('reviewRegressions') {
            java.srcDir(file('tools/review-regressions/java'))
            resources.srcDir(file('build/review-regressions/resources'))
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath
        }
        tasks.named(checks.processResourcesTaskName).configure { dependsOn(fixture) }
        neoForge.mods.lyycore.sourceSet(checks)
        neoForge.runs {
            reviewRegressions {
                type = 'gameTestServer'
                gameDirectory = file('build/review-regressions/run')
                logLevel = org.slf4j.event.Level.INFO
                systemProperty 'neoforge.enabledGameTestNamespaces', 'lyycore'
            }
        }
    }
}
