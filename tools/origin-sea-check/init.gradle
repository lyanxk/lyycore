// Opt-in render smoke test. These sources are never included in a normal build.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('tools/origin-sea-check/java'))
        neoForge.runs {
            originSeaCheck {
                client()
                gameDirectory = file('build/origin-sea-check/run')
                programArguments.addAll '--width', '1600', '--height', '900'
                systemProperty 'lyycore.originSeaCheck', 'true'
                systemProperty 'lyycore.originSeaOutput', file('build/origin-sea-check').absolutePath
            }
        }
    }
}
